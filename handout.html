<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發書名單（列印）| KCIS IPD SY26-27</title>
<style>
  :root { --blue:#00A3E0; --dark:#334155; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif; background:#e5e7eb; color:#0f172a; }

  /* ---- 控制列（列印時隱藏） ---- */
  .bar { position:sticky; top:0; z-index:10; background:var(--blue); color:#fff; padding:10px 16px;
         display:flex; align-items:center; gap:12px; flex-wrap:wrap; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .bar b { font-size:16px; letter-spacing:.5px; }
  .bar .tag { background:rgba(255,255,255,.2); font-size:11px; padding:2px 8px; border-radius:4px; font-weight:700; }
  .bar select { padding:6px 10px; border-radius:8px; border:none; font-size:14px; font-weight:700; color:#0f172a; }
  .bar button { margin-left:auto; background:#fff; color:var(--blue); border:none; padding:8px 18px;
                border-radius:20px; font-weight:800; font-size:14px; cursor:pointer; }
  .bar button:hover { background:#f0f9ff; }
  .bar .status { font-size:13px; opacity:.9; }

  /* ---- 文件內容 ---- */
  #doc { max-width:900px; margin:20px auto; padding:0 12px; }
  .class-page { background:#fff; padding:24px 26px; margin-bottom:22px; border-radius:6px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .cls-head { font-size:20px; font-weight:800; }
  .cls-sub { font-size:12px; color:#666; margin:3px 0 10px; }
  .reminder { background:#fef3c7; color:#92400e; border:1px solid #f59e0b; border-radius:5px;
              padding:7px 12px; font-weight:800; font-size:13px; margin-bottom:10px; }
  .instruction { font-size:12px; color:#475569; margin-bottom:14px; }

  .book-block { margin-bottom:14px; break-inside:avoid; }
  .book-bar { background:var(--blue); color:#fff; font-weight:700; font-size:14px; padding:5px 10px; border-radius:4px 4px 0 0; }
  table.stu { width:100%; border-collapse:collapse; font-size:13px; }
  table.stu th { background:var(--dark); color:#fff; font-weight:700; padding:5px 6px; border:.5px solid #cbd5e1; }
  table.stu td { padding:4px 6px; border:.5px solid #cbd5e1; }
  table.stu tbody tr:nth-child(even) { background:#f8fafc; }
  .ctr { text-align:center; }
  .chk { display:inline-block; width:15px; height:15px; border:1.6px solid var(--dark); border-radius:3px; vertical-align:middle; }
  .ebk { color:#94a3b8; font-weight:700; }

  .sign { margin-top:16px; padding-top:10px; border-top:1px dashed #cbd5e1; font-size:14px; font-weight:700; }
  .sign .line { display:inline-block; border-bottom:1px solid #334155; min-width:180px; margin:0 6px; }
  .sign .date { display:inline-block; border-bottom:1px solid #334155; min-width:110px; margin:0 6px; }

  #loading { text-align:center; color:#64748b; padding:60px 0; font-size:14px; }

  /* ---- 列印 ---- */
  @page { size:A4; margin:10mm; }
  @media print {
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    body { background:#fff; }
    .no-print { display:none !important; }
    #doc { max-width:none; margin:0; padding:0; }
    .class-page { box-shadow:none; border-radius:0; padding:0; margin:0; break-after:page; }
    .class-page:last-child { break-after:auto; }
    .book-block { break-inside:auto; margin-bottom:8px; }
    .book-bar { break-after:avoid; }
    table.stu thead { display:table-header-group; }
    table.stu tr { break-inside:avoid; }
    table.stu th { padding:3px 6px; }
    table.stu td { padding:2px 6px; }
    .sign { break-inside:avoid; margin-top:8px; padding-top:6px; }
  }
</style>
</head>
<body>

<div class="bar no-print">
  <b>KCIS 發書名單</b>
  <span class="tag">SY26-27</span>
  <label style="font-size:13px;font-weight:700;">班級：</label>
  <select id="scope" onchange="render()">
    <option value="__NUM__">全部雙語班</option>
  </select>
  <span class="status" id="status"></span>
  <span class="hint" style="font-size:12px;opacity:.85;">選「全部…」可一次印多班</span>
  <button onclick="window.print()">🖨 列印 / 存 PDF</button>
</div>

<div id="doc"><div id="loading">連線中，載入班級資料…</div></div>

<script>
const API_BASE = "https://script.google.com/macros/s/AKfycbwmKGOz4eSzEuyt65P6T2_knuNkj3LpCmnfJPXK8r4GM-MdUUfwVys1YMw7T-uY59Y-gQ/exec";
const TODAY = new Date().toLocaleDateString("zh-TW", { year:"numeric", month:"2-digit", day:"2-digit" });

let allClasses = [];
let numericClasses = [];   // 雙語班（純數字）
let letterClasses = [];    // 留學班（含字母）
const cache = {};  // hr -> getClassBooks 結果

// Apps Script 偶爾回傳 HTML 錯誤頁而不是 JSON（冷啟動或多班同時載入時）。
// 收到非 JSON 就稍等後自動重試，避免整頁卡在「載入中」。
async function fetchJson(url, tries){
  tries = tries || 4;
  let lastErr;
  for (let k=0; k<tries; k++){
    try {
      const text = await (await fetch(url)).text();
      try { return JSON.parse(text); }
      catch(e){ lastErr = new Error("後端暫時忙碌"); }
    } catch(e){ lastErr = e; }
    await new Promise(r=>setTimeout(r, 600*(k+1)));
  }
  throw lastErr || new Error("載入失敗");
}

// 限制同時請求數：一次最多 limit 個，避免一口氣打十幾個把 GAS 逼爆而回錯誤頁。
async function mapLimit(items, limit, fn){
  const results = new Array(items.length);
  let idx = 0;
  async function worker(){
    while (idx < items.length){
      const cur = idx++;
      results[cur] = await fn(items[cur], cur);
    }
  }
  const workers = [];
  for (let i=0; i<Math.min(limit, items.length); i++) workers.push(worker());
  await Promise.all(workers);
  return results;
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function isNumeric(hr){ return /^\d+$/.test(String(hr)); }
function seatNum(s){ const n=parseInt(s,10); return isNaN(n)?9999:n; }

// 純電子書（有 EBOOK/電子書字樣、但非「實體書+電子書」）→ 不用勾選
function isEbookOnly(title){
  const t = String(title||"");
  if (t.indexOf("實體書") !== -1) return false;
  return /EBOOK/i.test(t) || t.indexOf("電子書") !== -1;
}

// 筆記本提醒：多種同為每人1本、同班人數時合併成一句
function reminderText(supplies, count){
  if(!supplies || !supplies.length) return "";
  const cnts = supplies.map(s=> s.students ? s.students.length : count);
  const qtys = supplies.map(s=> s.qty || 1);
  const total = supplies.reduce((sum,s,i)=> sum + qtys[i]*cnts[i], 0);
  if(supplies.length === 1){
    return `${esc(supplies[0].title)}：每人 ${qtys[0]} 本，全班 ${cnts[0]} 人 → 共 ${total} 本`;
  }
  const sameQty = qtys.every(q=>q===qtys[0]);
  const sameCnt = cnts.every(c=>c===cnts[0]);
  if(sameQty && sameCnt){
    const pre = supplies.map(s=> String(s.title).replace(/筆記本$/,""));
    const joined = pre.slice(0,-1).join("、") + "及" + pre[pre.length-1];
    return `${joined}筆記本：每人各 ${qtys[0]} 本，全班 ${cnts[0]} 人 → 共 ${total} 本`;
  }
  return supplies.map((s,i)=> `${esc(s.title)}：每人 ${qtys[i]} 本，全班 ${cnts[i]} 人 → 共 ${qtys[i]*cnts[i]} 本`).join("；");
}

async function init(){
  try{
    allClasses = await fetchJson(API_BASE + "?action=getClasses");
    numericClasses = allClasses.filter(isNumeric).sort((a,b)=>parseInt(a)-parseInt(b));
    letterClasses = allClasses.filter(c=>!isNumeric(c)).sort();
    // 建立下拉：全部班級 / 全部雙語班 / 全部留學班 + 各單班
    const sel = document.getElementById("scope");
    sel.innerHTML =
        '<option value="__ALL__">全部班級</option>'
      + '<option value="__NUM__" selected>全部雙語班</option>'
      + '<option value="__ALPHA__">全部留學班</option>'
      + '<optgroup label="雙語班（單班）">'
      + numericClasses.map(c=>`<option value="${c}">${c} 班</option>`).join("")
      + '</optgroup>'
      + '<optgroup label="留學班（單班）">'
      + letterClasses.map(c=>`<option value="${c}">${c} 班</option>`).join("")
      + '</optgroup>';
    render();
  }catch(e){
    document.getElementById("doc").innerHTML = '<div id="loading">載入失敗，請重新整理頁面</div>';
  }
}

async function getClass(hr){
  if(cache[hr]) return cache[hr];
  cache[hr] = await fetchJson(API_BASE + "?action=getClassBooks&class=" + encodeURIComponent(hr));
  return cache[hr];
}

async function render(){
  const scope = document.getElementById("scope").value;
  let list;
  if (scope === "__ALL__") list = numericClasses.concat(letterClasses);
  else if (scope === "__NUM__") list = numericClasses;
  else if (scope === "__ALPHA__") list = letterClasses;
  else list = [scope];
  document.getElementById("doc").innerHTML = '<div id="loading">載入中…</div>';
  document.getElementById("status").textContent = "載入 " + list.length + " 個班…";

  try {
    // 一次最多 5 個班同時抓，個別失敗會自動重試，不會整頁卡住
    const results = await mapLimit(list, 5, getClass);
    const html = list.map((hr,i)=>classSection(hr, results[i])).join("");
    document.getElementById("doc").innerHTML = html || '<div id="loading">此班沒有資料</div>';
    document.getElementById("status").textContent = "共 " + list.length + " 個班，可直接列印";
  } catch(e){
    document.getElementById("doc").innerHTML = '<div id="loading">部分班級載入失敗，請按重新整理再試一次</div>';
    document.getElementById("status").textContent = "載入失敗";
  }
}

function classSection(hr, res){
  const books = (res.books||[]).filter(b=>b.type==="book").sort((a,b)=>a.title.localeCompare(b.title));
  const supplies = (res.books||[]).filter(b=>b.type==="supply");
  const count = res.studentCount || 0;

  const reminder = reminderText(supplies, count);

  const booksHTML = books.map(b=>{
    const ebook = isEbookOnly(b.title);
    const studs = (b.students||[]).slice().sort((x,y)=>seatNum(x.seat)-seatNum(y.seat));
    const rows = studs.map(s=>`<tr>
        <td class="ctr">${esc(s.seat)}</td>
        <td>${esc(s.name)}</td>
        <td>${esc(s.en)}</td>
        <td class="ctr">${esc(s.id)}</td>
        <td class="ctr">${ebook ? '<span class="ebk">—</span>' : '<span class="chk"></span>'}</td>
      </tr>`).join("");
    const barNote = ebook ? '　·　電子書（無實體、免勾選）' : '';
    return `<div class="book-block">
        <div class="book-bar">《${esc(b.title)}》　領書 ${studs.length} 人　ISBN ${esc(b.isbn)}${barNote}</div>
        <table class="stu">
          <thead><tr><th style="width:52px">座號</th><th>中文姓名</th><th>英文名</th><th style="width:90px">學號</th><th style="width:56px">勾選</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }).join("");

  return `<section class="class-page">
      <div class="cls-head">${esc(hr)} 班　發書名單（依書分）</div>
      <div class="cls-sub">列印日期：${TODAY}　｜　全班 ${count} 人　｜　書種 ${books.length} 種</div>
      ${reminder ? `<div class="reminder">📓 筆記本提醒　${reminder}</div>` : ""}
      <div class="instruction">說明：請導師發放後，於「勾選」欄打勾；筆記本每人各 1 本（見上方提醒）；標示「電子書」者無實體、免勾選。全部發放完畢後，請於下方簽名，並將簽收單連同未發出的書籍(開學日未到校學生的書)一併交回 IPD，謝謝老師。</div>
      ${booksHTML}
      <div class="sign">導師簽名：<span class="line"></span>　日期：<span class="date"></span></div>
    </section>`;
}

init();
</script>
</body>
</html>
