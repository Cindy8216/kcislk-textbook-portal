<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分書工具 | KCIS IPD SY26-27</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --kcis-blue: #00A3E0; }
        .book-card { transition: all 0.2s; cursor: pointer; }
        .book-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.12); }
        .book-card.all-done { opacity: 0.45; }
        input[type=number] { -moz-appearance: textfield; }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="sticky top-0 z-40 shadow-md" style="background:#00A3E0">
        <div class="max-w-6xl mx-auto px-4 py-3">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-3">
                    <span class="text-white font-black text-base tracking-tight">KCIS 分書工具</span>
                    <span class="bg-white/20 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase">SY26-27</span>
                </div>
                <div class="flex items-center gap-3">
                    <span id="saveStatus" class="text-[11px] font-bold"></span>
                    <span id="overallProgress" class="text-white/90 text-sm font-bold"></span>
                </div>
            </div>
            <div class="flex gap-2">
                <input id="searchBox" type="text" placeholder="搜尋書名或掃 ISBN 條碼..." oninput="renderGrid()" onkeydown="handleSearchKey(event)"
                    class="flex-1 px-3 py-1.5 rounded-lg text-sm font-bold text-slate-800 outline-none border-2 border-transparent focus:border-white/50"
                    style="background:rgba(255,255,255,0.9)">
                <select id="supplierFilter" onchange="renderGrid()"
                    class="px-3 py-1.5 rounded-lg text-sm font-bold text-slate-800 outline-none border-2 border-transparent"
                    style="background:rgba(255,255,255,0.9)">
                    <option value="all">全部書商</option>
                </select>
                <select id="statusFilter" onchange="renderGrid()"
                    class="px-3 py-1.5 rounded-lg text-sm font-bold text-slate-800 outline-none border-2 border-transparent"
                    style="background:rgba(255,255,255,0.9)">
                    <option value="all">全部</option>
                    <option value="pending">未完成</option>
                    <option value="done">已完成</option>
                    <option value="stock_needed">需動庫存</option>
                </select>
            </div>
        </div>
    </div>

    <main class="max-w-6xl mx-auto p-4 mt-4">
        <div id="loading" class="text-center py-24 text-slate-400 text-sm">連線中，請稍候...</div>
        <div id="bookGrid" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </main>

    <div id="modalBg" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl md:rounded-2xl overflow-hidden" onclick="event.stopPropagation()">
            <div class="px-5 py-4 flex items-start justify-between" style="background:#00A3E0">
                <div>
                    <h2 id="modalTitle" class="text-white font-black text-base leading-tight"></h2>
                    <p id="modalISBN" class="text-white/60 text-xs mt-1 font-mono"></p>
                </div>
                <button onclick="closeModal()" class="text-white/70 hover:text-white text-2xl leading-none ml-4 mt-0.5">&#x2715;</button>
            </div>

            <div id="modalStats" class="px-5 py-2.5 bg-sky-50 border-b border-sky-100 flex justify-around text-center"></div>

            <div class="px-5 py-2 bg-slate-100 border-b border-slate-200 flex justify-between">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">班級</span>
                <div class="flex gap-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                    <span class="w-12 text-center">需要</span>
                    <span class="w-16 text-center">已放</span>
                    <span class="w-10 text-center">狀態</span>
                </div>
            </div>

            <div id="modalBody" class="overflow-y-auto divide-y divide-slate-100" style="max-height:320px"></div>

            <div class="px-5 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
                <span id="modalSummary" class="text-sm font-bold text-slate-600"></span>
                <button onclick="markAllDone()" class="text-white text-xs px-4 py-2 rounded-full font-bold" style="background:#00A3E0">全部放好</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://script.google.com/macros/s/AKfycbwmKGOz4eSzEuyt65P6T2_knuNkj3LpCmnfJPXK8r4GM-MdUUfwVys1YMw7T-uY59Y-gQ/exec";
        const STORAGE_KEY = "kcis_sort_sy2627";
        const MIGRATED_KEY = "kcis_sort_migrated";

        let allBooks = [];
        let currentBook = null;
        let placed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

        // Apps Script 偶爾回傳 HTML 錯誤頁而不是 JSON（冷啟動或尖峰時）。
        // 收到非 JSON 就稍等後自動重試，避免載入失敗。
        async function fetchJson(url, tries) {
            tries = tries || 3;
            let lastErr;
            for (let k = 0; k < tries; k++) {
                try {
                    const text = await (await fetch(url)).text();
                    try { return JSON.parse(text); }
                    catch (e) { lastErr = new Error("後端暫時忙碌"); }
                } catch (e) { lastErr = e; }
                await new Promise(r => setTimeout(r, 600 * (k + 1)));
            }
            throw lastErr || new Error("載入失敗");
        }

        function getPlaced(isbn, hr) {
            return (placed[isbn] && placed[isbn][hr] != null) ? placed[isbn][hr] : 0;
        }

        function savePlaced(isbn, hr, val) {
            if (!placed[isbn]) placed[isbn] = {};
            placed[isbn][hr] = val;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(placed)); // 本機鏡像
            markDirty(isbn, hr, val);   // 排入雲端同步
        }

        // ===== 雲端同步（共用進度，存後端）=====
        let pending = {};        // {isbn:{hr:qty}} 待送
        let saveTimer = null;
        let saving = false;

        function setSaveStatus(s) {
            const el = document.getElementById("saveStatus");
            if (!el) return;
            if (s === "saving")     { el.textContent = "● 儲存中…";       el.style.color = "#fef9c3"; }
            else if (s === "saved") { el.textContent = "✓ 已存雲端";       el.style.color = "#bbf7d0"; }
            else if (s === "error") { el.textContent = "⚠ 儲存失敗，重試中"; el.style.color = "#fecaca"; }
            else                    { el.textContent = ""; }
        }

        function markDirty(isbn, hr, qty) {
            if (!pending[isbn]) pending[isbn] = {};
            pending[isbn][hr] = qty;
            scheduleFlush();
        }

        function scheduleFlush() {
            setSaveStatus("saving");
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(flushSaves, 600);
        }

        async function flushSaves() {
            if (saving) { scheduleFlush(); return; }
            const batch = pending;
            pending = {};
            const isbns = Object.keys(batch);
            if (isbns.length === 0) { setSaveStatus("saved"); return; }
            saving = true;
            try {
                for (const isbn of isbns) {
                    const url = API_BASE + "?action=savePlacedBatch&isbn=" + encodeURIComponent(isbn)
                              + "&data=" + encodeURIComponent(JSON.stringify(batch[isbn]));
                    const j = await fetchJson(url);
                    if (!j || !j.ok) throw new Error("save failed");
                }
                setSaveStatus("saved");
            } catch (e) {
                // 失敗：併回 pending 稍後重試
                for (const isbn of isbns) {
                    pending[isbn] = Object.assign({}, batch[isbn], pending[isbn] || {});
                }
                setSaveStatus("error");
                setTimeout(scheduleFlush, 3000);
            } finally {
                saving = false;
                if (Object.keys(pending).length) scheduleFlush();
            }
        }

        function isBookDone(book) {
            return Object.entries(book.classes).every(([hr, need]) => getPlaced(book.isbn, hr) >= need);
        }

        function totalFor(book) {
            const need = Object.values(book.classes).reduce((a, b) => a + b, 0);
            const done = Object.keys(book.classes).reduce((a, hr) => a + getPlaced(book.isbn, hr), 0);
            return { need, done };
        }

        async function init() {
            try {
                allBooks = await fetchJson(API_BASE + "?action=getDistribution");

                // 讀回雲端共用進度（失敗則沿用本機暫存）
                try {
                    const p = await fetchJson(API_BASE + "?action=getPlaced");
                    if (p && typeof p === "object") {
                        const serverEmpty = Object.keys(p).length === 0;
                        const localData = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
                        const localHas = Object.keys(localData).length > 0;
                        const migrated = localStorage.getItem(MIGRATED_KEY) === "1";
                        if (serverEmpty && localHas && !migrated) {
                            // 首次（且從未搬過）：把本機既有進度搬上雲端
                            placed = localData;
                            localStorage.setItem(MIGRATED_KEY, "1");
                            Object.keys(localData).forEach(isbn =>
                                Object.keys(localData[isbn]).forEach(hr =>
                                    markDirty(isbn, hr, localData[isbn][hr])));
                        } else {
                            // 一律以雲端為準（含重置後的「空」）
                            placed = p;
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(placed));
                            localStorage.setItem(MIGRATED_KEY, "1");
                        }
                    }
                } catch (e2) { /* 離線就用本機鏡像 */ }

                buildSupplierFilter();
                renderGrid();
                document.getElementById("loading").classList.add("hidden");
                document.getElementById("bookGrid").classList.remove("hidden");
            } catch (e) {
                document.getElementById("loading").textContent = "載入失敗，請重新整理頁面";
            }
        }

        function buildSupplierFilter() {
            const suppliers = [...new Set(allBooks.map(b => b.supplier).filter(s => s))].sort((a, b) => a.localeCompare(b, "zh-Hant"));
            const sel = document.getElementById("supplierFilter");
            sel.innerHTML = '<option value="all">全部書商</option>' +
                suppliers.map(s => `<option value="${s.replace(/"/g, "&quot;")}">${s}</option>`).join("");
        }

        function renderGrid() {
            const doneCount = allBooks.filter(isBookDone).length;
            document.getElementById("overallProgress").textContent = "完成 " + doneCount + " / " + allBooks.length + " 種";

            const keyword = (document.getElementById("searchBox")?.value || "").toLowerCase().trim();
            const statusFilter = document.getElementById("statusFilter")?.value || "all";
            const supplierFilter = document.getElementById("supplierFilter")?.value || "all";

            const filtered = allBooks.filter(book => {
                if (supplierFilter !== "all" && (book.supplier || "") !== supplierFilter) return false;
                if (keyword) {
                    const isbnClean = String(book.isbn).replace(/-/g, "");
                    const kwClean = keyword.replace(/-/g, "");
                    const matchTitle = book.title.toLowerCase().includes(keyword);
                    const matchISBN = isbnClean.includes(kwClean);
                    if (!matchTitle && !matchISBN) return false;
                }
                if (statusFilter === "done" && !isBookDone(book)) return false;
                if (statusFilter === "pending" && isBookDone(book)) return false;
                if (statusFilter === "stock_needed") {
                    const need = Object.values(book.classes).reduce((a, b) => a + b, 0);
                    if ((book.order || 0) >= need) return false;
                }
                return true;
            });

            document.getElementById("bookGrid").innerHTML = filtered.map(book => {
                const isDone = isBookDone(book);
                const { need, done } = totalFor(book);
                const classCount = Object.keys(book.classes).length;
                const isbn = String(book.isbn).replace(/-/g, "");
                const coverUrl = book.coverUrl || ("https://covers.openlibrary.org/b/isbn/" + isbn + "-M.jpg");
                const fallback = "https://via.placeholder.com/200x280/F1F5F9/94A3B8?text=No+Cover";

                const isSupply = book.type === "supply";
                const thumb = isSupply
                    ? `<div class="h-full w-full flex flex-col items-center justify-center gap-2" style="background:#e0f2fe">
                           <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                               <path d="M4 4a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 2v20"/><path d="M12 7h4M12 11h4"/>
                           </svg>
                           <span class="text-[10px] font-black" style="color:#0284c7">筆記本</span>
                       </div>`
                    : `<img src="${coverUrl}" onerror="this.src='${fallback}'" class="h-full w-full object-cover">`;

                return `<div class="book-card bg-white rounded-2xl overflow-hidden border ${isSupply ? "border-sky-300" : "border-slate-200"} ${isDone ? "all-done" : ""}" onclick="openModal('${book.isbn}')">
                    <div class="relative bg-slate-100 flex items-center justify-center overflow-hidden" style="height:160px">
                        ${thumb}
                        ${isDone ? `<div class="absolute inset-0 flex items-center justify-center" style="background:rgba(34,197,94,0.35)">
                            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>` : ""}
                    </div>
                    <div class="p-3">
                        <p class="text-[11px] font-black text-slate-800 leading-tight mb-1 line-clamp-2">${book.title}</p>
                        ${book.supplier ? `<p class="text-[10px] font-bold text-sky-600 mb-1.5 truncate">🏢 ${book.supplier}</p>` : ""}
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] text-slate-400">${classCount} 個班</span>
                            <span class="text-[11px] font-bold ${done >= need ? "text-green-600" : "text-slate-500"}">各班需求 ${done}/${need}</span>
                        </div>
                        ${(book.order || book.total) ? `<div class="flex items-center justify-between mt-1 pt-1 border-t border-slate-100 text-[10px]">
                            <span class="text-slate-400">訂單量 <strong class="text-slate-700">${book.order || 0}</strong></span>
                            <span class="text-slate-400">總數(含庫存) <strong class="text-slate-700">${book.total || 0}</strong></span>
                        </div>` : ""}
                        ${(() => {
                            const order = book.order || 0;
                            const total = book.total || 0;
                            if (total === 0 && order === 0) return "";
                            const inventory = Math.max(0, total - order);
                            const leftover = total - need;
                            if (order >= need) {
                                return `<div class="mt-1 text-[10px] font-bold px-2 py-0.5 rounded text-center" style="background:#dcfce7;color:#166534">訂單足夠 ✓　剩 ${leftover} 本</div>`;
                            } else if (total >= need) {
                                return `<div class="mt-1 text-[10px] font-bold px-2 py-0.5 rounded text-center" style="background:#fef3c7;color:#92400e">需動庫存 ${need - order} 本　剩 ${leftover} 本</div>`;
                            } else if (inventory > 0) {
                                return `<div class="mt-1 text-[10px] font-bold px-2 py-0.5 rounded text-center" style="background:#fee2e2;color:#991b1b">動庫存 ${inventory} 本，仍缺 ${need - total} 本</div>`;
                            } else {
                                return `<div class="mt-1 text-[10px] font-bold px-2 py-0.5 rounded text-center" style="background:#fee2e2;color:#991b1b">庫存不足，缺 ${need - total} 本</div>`;
                            }
                        })()}
                    </div>
                </div>`;
            }).join("");
        }

        function openModal(isbn) {
            currentBook = allBooks.find(b => b.isbn === isbn);
            if (!currentBook) return;
            const totalNeedAll = Object.values(currentBook.classes).reduce((s, n) => s + n, 0);
            const stock = currentBook.stock || 0;
            const stockDiff = stock - totalNeedAll;
            const stockLabel = stock === 0 ? "" :
                stockDiff >= 0 ? `　庫存 ${stock} 本 ✓ 多 ${stockDiff}` : `　庫存 ${stock} 本 ✗ 差 ${Math.abs(stockDiff)}`;
            document.getElementById("modalTitle").textContent = currentBook.title;
            const supplierLabel = currentBook.supplier ? "🏢 " + currentBook.supplier + "　" : "";
            document.getElementById("modalISBN").textContent = supplierLabel + "ISBN " + currentBook.isbn + stockLabel;

            // 各班需求 / 訂單量 / 總數(含庫存) 三個數字一覽
            const order = currentBook.order || 0;
            const total = currentBook.total || 0;
            document.getElementById("modalStats").innerHTML = `
                <div><div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">各班需求</div><div class="text-lg font-black text-slate-800">${totalNeedAll}</div></div>
                <div><div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">訂單量</div><div class="text-lg font-black text-slate-800">${order}</div></div>
                <div><div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">總數(含庫存)</div><div class="text-lg font-black text-slate-800">${total}</div></div>`;

            renderModalBody();
            document.getElementById("modalBg").classList.remove("hidden");
        }

        function renderModalBody() {
            const classes = Object.entries(currentBook.classes).sort(([a], [b]) => a.localeCompare(b));
            const totalNeed = classes.reduce((s, [, n]) => s + n, 0);
            const totalDone = classes.reduce((s, [hr]) => s + getPlaced(currentBook.isbn, hr), 0);

            document.getElementById("modalBody").innerHTML = classes.map(([hr, need]) => {
                const p = getPlaced(currentBook.isbn, hr);
                let badge, badgeStyle;
                if (p === 0) {
                    badge = "未放"; badgeStyle = "background:#f1f5f9;color:#64748b";
                } else if (p === need) {
                    badge = "OK"; badgeStyle = "background:#dcfce7;color:#166534";
                } else if (p > need) {
                    badge = "多" + (p - need); badgeStyle = "background:#fef3c7;color:#92400e";
                } else {
                    badge = "差" + (need - p); badgeStyle = "background:#fee2e2;color:#991b1b";
                }

                return `<div class="flex items-center px-5 py-3 gap-3">
                    <span class="font-black text-slate-800 text-sm w-10">${hr}</span>
                    <span class="text-slate-500 text-sm flex-1">需 <strong class="text-slate-800">${need}</strong> 本</span>
                    <input type="number" min="0" value="${p}"
                        class="w-16 text-center border-2 border-slate-200 rounded-lg py-1 text-sm font-bold focus:border-blue-400 outline-none"
                        oninput="updatePlaced('${hr}', this)">
                    <span class="text-[11px] font-bold px-2 py-0.5 rounded-full w-10 text-center" style="${badgeStyle}">${badge}</span>
                </div>`;
            }).join("");

            document.getElementById("modalSummary").textContent = "共 " + totalDone + " / " + totalNeed + " 本";
        }

        function updatePlaced(hr, input) {
            let val = parseInt(input.value) || 0;
            const total = currentBook.total || 0;

            // 防呆：所有班總和不能超過 Total（書的實際數量上限）
            if (total > 0) {
                const otherPlaced = Object.entries(currentBook.classes)
                    .filter(([h]) => h !== hr)
                    .reduce((sum, [h]) => sum + getPlaced(currentBook.isbn, h), 0);
                const maxAllowed = Math.max(0, total - otherPlaced);
                if (val > maxAllowed) {
                    val = maxAllowed;
                    input.value = val;
                    input.style.borderColor = "#ef4444";
                    setTimeout(() => { input.style.borderColor = ""; }, 1000);
                }
            }

            savePlaced(currentBook.isbn, hr, val);
            renderModalBody();
            renderGrid();
        }

        function markAllDone() {
            const total = currentBook.total || 0;
            const classes = Object.entries(currentBook.classes).sort(([a], [b]) => a.localeCompare(b));
            const sumNeeds = classes.reduce((s, [, n]) => s + n, 0);

            if (total === 0 || total >= sumNeeds) {
                classes.forEach(([hr, need]) => savePlaced(currentBook.isbn, hr, need));
            } else {
                let remaining = total;
                classes.forEach(([hr, need]) => {
                    const p = Math.min(need, remaining);
                    savePlaced(currentBook.isbn, hr, p);
                    remaining -= p;
                });
            }
            renderModalBody();
            renderGrid();
        }

        function handleSearchKey(e) {
            if (e.key !== "Enter") return;
            const keyword = e.target.value.replace(/-/g, "").trim();
            if (!keyword) return;
            const match = allBooks.find(book =>
                String(book.isbn).replace(/-/g, "") === keyword
            ) || allBooks.find(book =>
                book.title.toLowerCase().includes(keyword.toLowerCase())
            );
            if (match) {
                openModal(match.isbn);
                e.target.value = "";
                renderGrid();
            }
        }

        function closeModal() {
            document.getElementById("modalBg").classList.add("hidden");
            currentBook = null;
        }

        document.getElementById("modalBg").addEventListener("click", function(e) {
            if (e.target === this) closeModal();
        });

        init();
    </script>
</body>
</html>
