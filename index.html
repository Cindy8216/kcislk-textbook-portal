<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>115 學年度課本預訂系統 | KCIS Linkou IPD</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@1.21.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background-color: #f8fafc; }
        .header-bg { background: linear-gradient(135deg, #0d9488 0%, #064e3b 100%); }
        .login-bg { background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); background-attachment: fixed; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* 嚴格保留學科飾條顏色 */
        .course-card-math { border-left: 5px solid #ef4444 !important; }
        .course-card-social { border-left: 5px solid #0ea5e9 !important; }
        .course-card-science { border-left: 5px solid #10b981 !important; }
        .course-card-default { border-left: 5px solid #64748b !important; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #5eead4; border-radius: 10px; }
        .img-loading { background: linear-gradient(90deg, #f0fdfa 25%, #ccfbf1 50%, #f0fdfa 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { from { background-position: 200% 0; } to { background-position: -200% 0; } }
        .mesh-pattern { background-image: radial-gradient(#ffffff15 1px, transparent 1px); background-size: 15px 15px; }

        /* 表格斑馬紋優化 - 顯著加深以便手機與電腦閱讀 */
        .zebra-table tr:nth-child(even) { background-color: rgba(204, 251, 241, 0.45); }
    </style>
</head>
<body class="text-slate-700 text-xs md:text-sm transition-all duration-300">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, collection, setDoc, serverTimestamp, writeBatch, query, where, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const { useState, useEffect, useMemo, useCallback } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBx1mAOiqKgFgwZd9AJ33TWFDkMM8YgLc4",
            authDomain: "textbook-order.firebaseapp.com",
            projectId: "textbook-order",
            storageBucket: "textbook-order.firebasestorage.app",
            messagingSenderId: "789328694108",
            appId: "1:789328694108:web:00976d2cac7f017a558f99",
            measurementId: "G-38XPPEVX3P"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);
        const appId = "textbook-order-sy26";
        const ADMIN_PASSWORD = "8216";

        const ORDER_DEADLINE = new Date("2026-06-03T23:59:59");

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, []);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const CheckSquareIcon = ({ size = 20, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0">
                <polyline points="9 11 12 14 22 4"></polyline>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
        );

        const SquareIcon = ({ size = 20, color = "currentColor" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="shrink-0">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            </svg>
        );

        const BookCover = ({ isbn, coverUrl, title }) => {
            const [status, setStatus] = useState('loading');
            const [useFallback, setUseFallback] = useState(false);
            const finalSrc = useMemo(() => {
                if (useFallback) return isbn ? `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg` : null;
                return coverUrl || (isbn ? `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg` : null);
            }, [isbn, coverUrl, useFallback]);
            useEffect(() => { setStatus('loading'); setUseFallback(false); }, [coverUrl, isbn]);
            if (!finalSrc || (status === 'error' && useFallback)) {
                return (
                    <div className="w-full h-full bg-slate-100 flex flex-col items-center justify-center text-slate-300">
                        <span className="text-[8px] font-black uppercase opacity-30">No Cover</span>
                    </div>
                );
            }
            return (
                <div className={`w-full h-full ${status === 'loading' ? 'img-loading' : 'bg-white'}`}>
                    <img src={finalSrc} alt={title} onLoad={() => setStatus('success')}
                        onError={() => { if (!useFallback && isbn) { setUseFallback(true); } else { setStatus('error'); } }}
                        className={`w-full h-full object-cover transition-opacity duration-300 ${status === 'success' ? 'opacity-100' : 'opacity-0'}`} />
                </div>
            );
        };

        function App() {
            const [step, setStep] = useState('login');
            const [adminTab, setAdminTab] = useState('summary');
            const [studentId, setStudentId] = useState('');
            const [verifyCode, setVerifyCode] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');
            const [studentData, setStudentData] = useState(null);
            const [library, setLibrary] = useState({});
            const [selections, setSelections] = useState({});
            const [allOrders, setAllOrders] = useState([]);
            const [allEnrollment, setAllEnrollment] = useState([]);
            const [bookStats, setBookStats] = useState({});
            const [importType, setImportType] = useState('enrollment');
            const [csvInput, setCsvInput] = useState('');

            const isExpired = new Date() > ORDER_DEADLINE;

            useEffect(() => {
                signInAnonymously(auth).catch(err => console.error("Mount anonymous auth failed:", err));
                const unsubscribe = onAuthStateChanged(auth, (user) => {});
                return () => unsubscribe();
            }, []);

            const fetchAdminData = async () => {
                setIsLoading(true);
                setError('');
                try {
                    const [libSnap, enrollSnap, orderSnap] = await Promise.all([
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'library')),
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'enrollment')),
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'orders'))
                    ]);
                    const libData = {}; libSnap.forEach(d => libData[d.id] = d.data());
                    setLibrary(libData);

                    const enrollMap = {}; const enrollList = [];
                    enrollSnap.forEach(d => {
                        const data = d.data(); const sid = String(d.id || data.studentId || "").trim().toUpperCase();
                        if (!sid) return;
                        enrollList.push({ ...data, id: sid, studentId: sid });
                        enrollMap[sid] = data.courses || [];
                    });
                    setAllEnrollment(enrollList);

                    const ordersList = []; const statsMap = {};
                    orderSnap.forEach((doc) => {
                        const data = doc.data();
                        const sid = String(data.studentId || doc.id).trim().toUpperCase();
                        if (!enrollMap[sid]) return;

                        const currentCourses = enrollMap[sid];
                        const filteredSelections = {};
                        Object.entries(data.selections || {}).forEach(([courseCode, books]) => {
                            if (currentCourses.includes(courseCode)) {
                                filteredSelections[courseCode] = books;
                                if (Array.isArray(books)) {
                                    books.forEach(t => {
                                        if (t && !t.includes("Do not order") && !t.includes("不訂購") && !t.includes("No Specific Textbook Required")) {
                                            if (!statsMap[t]) statsMap[t] = { count: 0, students: [] };
                                            statsMap[t].count += 1;
                                            statsMap[t].students.push(`[${data.className || 'Unknown'}] ${data.cName || 'Student'} (${sid})`);
                                        }
                                    });
                                }
                            }
                        });
                        ordersList.push({ ...data, studentId: sid, selections: filteredSelections });
                    });
                    setAllOrders(ordersList); setBookStats(statsMap); setStep('admin');
                } catch (err) { setError("數據載入失敗。"); }
                finally { setIsLoading(false); }
            };

            const clearData = async (collectionName) => {
                if (!confirm(`警告：確定要清空雲端數據嗎？此操作無法還原。`)) return;
                setIsLoading(true);
                try {
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', collectionName));
                    const batch = writeBatch(db);
                    snap.forEach(d => batch.delete(doc(db, 'artifacts', appId, 'public', 'data', collectionName, d.id)));
                    await batch.commit();
                    alert("數據已清空。");
                    await fetchAdminData();
                } catch (err) {
                    alert("清空失敗");
                } finally {
                    setIsLoading(false);
                }
            };

            const escapeCSV = (val) => {
                if (val === null || val === undefined) return '""';
                const str = String(val);
                if (str.includes('"') || str.includes(',') || str.includes('\n')) return `"${str.replace(/"/g, '""')}"`;
                return str;
            };

            const exportToCSV = (type) => {
                const _now = new Date();
                const _pad = n => String(n).padStart(2,'0');
                const _datePrefix = `${_pad(_now.getMonth()+1)}${_pad(_now.getDate())}_${_pad(_now.getHours())}${_pad(_now.getMinutes())}_`;
                let headers, rows, filename;
                if (type === 'orders') {
                    headers = ["學號", "班級", "座號", "中文姓名", "英文姓名", "訂購內容清單", "時間"];
                    rows = allOrders.map(o => {
                        const validBooks = Object.values(o.selections || {}).flat().filter(b => b && !b.includes('不訂購') && !b.includes('No Specific Textbook Required'));
                        const enrollInfo = allEnrollment.find(e => e.studentId === o.studentId) || {};
                        return [o.studentId, o.className, enrollInfo.seatNumber || '', o.cName, o.name, validBooks.join('、'), o.updatedAt?.seconds ? new Date(o.updatedAt.seconds * 1000).toLocaleString() : ''];
                    });
                    filename = _datePrefix + "學生訂書總表.csv";
                } else if (type === 'books') {
                    headers = ["書名", "總量", "學生名單"];
                    rows = Object.entries(bookStats).sort((a,b)=>b[1].count-a[1].count).map(([t,d]) => [t, d.count, d.students.join('\n')]);
                    filename = _datePrefix + "採購發放清單.csv";
                } else if (type === 'pending') {
                    headers = ["學號", "班級", "座號", "中文姓名", "英文姓名"];
                    rows = getPendingStudents().map(e => [e.studentId, e.className, e.seatNumber || '', e.cName, e.name]);
                    filename = _datePrefix + "未填寫催報名單.csv";
                } else if (type === 'flat') {
                    headers = ["學號", "班級", "座號", "中文姓名", "英文姓名", "學科", "分級", "ISBN", "書名"];
                    rows = [];
                    allOrders.forEach(order => {
                        Object.entries(order.selections || {}).forEach(([courseCode, books]) => {
                            if (Array.isArray(books)) {
                                books.forEach(bookTitle => {
                                    if (bookTitle && !bookTitle.includes('不訂購') && !bookTitle.includes('No Specific Textbook Required')) {
                                        const libInfo = library[courseCode] || library[courseCode.toUpperCase()] || {};
                                        const enrollInfo = allEnrollment.find(e => e.studentId === order.studentId) || {};
                                        const bookDetail = (libInfo.books || []).find(b => b.title === bookTitle) || {};
                                        rows.push([order.studentId, order.className, enrollInfo.seatNumber || '', order.cName, order.name, libInfo.subject || '', libInfo.level || '', bookDetail.isbn || '', bookTitle]);
                                    }
                                });
                            }
                        });
                    });
                    filename = _datePrefix + "訂購明細_一書一列.csv";
                }
                const csvContent = "﻿" + [headers, ...rows].map(row => row.map(escapeCSV).join(",")).join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleLogin = async (e) => {
                if (e) e.preventDefault();
                if (isLoading) return;
                setIsLoading(true); setError('');
                try {
                    if (!auth.currentUser) await signInAnonymously(auth);

                    const sid = String(studentId || "").trim().toUpperCase();
                    const inputCode = String(verifyCode || "").trim();

                    if (!sid) {
                        throw new Error("請輸入學號");
                    }

                    // 1. 優先攔截並處理管理員登入與驗證
                    if (sid === 'ADMIN') {
                        if (inputCode === ADMIN_PASSWORD) {
                            await fetchAdminData();
                            return;
                        } else {
                            throw new Error("管理員驗證密碼錯誤");
                        }
                    }

                    // 2. 學生一般登入流程
                    const enrollSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'enrollment', sid));
                    if (!enrollSnap.exists()) throw new Error("查無此學號或資料未同步");

                    const data = enrollSnap.data();
                    if (!data) throw new Error("學生資料格式錯誤，請聯絡管理員");

                    // 驗證碼安全防護比對（支援空值、字串、數值相容轉換）
                    const dbCode = data.verifyCode !== undefined && data.verifyCode !== null ? String(data.verifyCode).trim() : "";
                    if (!dbCode || dbCode !== inputCode) {
                        throw new Error("學生驗證密碼錯誤");
                    }

                    const libSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'library'));
                    const libData = {}; libSnap.forEach(d => libData[d.id] = d.data());

                    const orderSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', sid));
                    const defaultSelections = {};
                    (data.courses || []).forEach(c => { defaultSelections[c] = ["Do not order 不訂購"]; });
                    setSelections(orderSnap.exists() ? (orderSnap.data().selections || {}) : defaultSelections);
                    setStudentData(data); setLibrary(libData); setStep('form');
                    window.scrollTo(0,0);
                } catch (err) {
                    console.error("Login Error Caught:", err);
                    // 核心修正：將所有非典型 Error 物件（如 FirebaseError、Null等）強制安全轉換為純字串，絕不引發 React 渲染崩潰
                    const errMsg = err && typeof err === 'object' && 'message' in err ? String(err.message) : String(err);
                    setError(errMsg || "登入失敗");
                }
                finally { setIsLoading(false); }
            };

            const processImport = async () => {
                if (!csvInput.trim() || isLoading) return;
                setIsLoading(true);
                try {
                    const parseExcelText = (text, delimiter = '\t') => {
                        const result = []; let row = []; let field = ''; let inQuotes = false;
                        for (let i = 0; i < text.length; i++) {
                            const char = text[i]; const nextChar = text[i + 1];
                            if (inQuotes) {
                                if (char === '"' && nextChar === '"') { field += '"'; i++; }
                                else if (char === '"') { inQuotes = false; }
                                else { field += char; }
                            } else {
                                if (char === '"') { inQuotes = true; }
                                else if (char === delimiter) { row.push(field.trim()); field = ''; }
                                else if (char === '\n' || (char === '\r' && nextChar === '\n')) {
                                    row.push(field.trim()); result.push(row); row = []; field = '';
                                    if (char === '\r') i++;
                                } else { field += char; }
                            }
                        }
                        if (field || row.length > 0) { row.push(field.trim()); result.push(row); }
                        return result;
                    };
                    const dataRows = parseExcelText(csvInput.trim(), '\t');
                    const batch = writeBatch(db); let importedCount = 0;
                    if (importType === 'enrollment') {
                        dataRows.forEach((row, idx) => {
                            if (idx === 0 && (row[0]?.includes("學號") || row[0]?.toUpperCase().includes("ID"))) return;
                            const sid = String(row[0] || "").toUpperCase(); if (!sid) return;
                            batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'enrollment', sid), {
                                studentId: sid, className: row[1] || "", seatNumber: row[2] || "", cName: row[3] || "", name: row[4] || "",
                                verifyCode: row[5] || "", courses: row[6] ? row[6].split(',').map(c => c.trim().toUpperCase()) : [],
                                grade: (row[1] || "").match(/\d+/)?.[0] || ""
                            });
                            importedCount++;
                        });
                    } else {
                        const libMap = {};
                        dataRows.forEach((row, idx) => {
                            if (idx === 0 && (row[0]?.includes("課程代碼") || row[1]?.toUpperCase().includes("SUBJECT"))) return;
                            const courseId = String(row[0] || "").toUpperCase(); if (!courseId) return;
                            if (!libMap[courseId]) libMap[courseId] = { courseId, subject: row[1], grade: row[2], courseName: row[3], publisher: row[4], level: row[7], books: [] };
                            libMap[courseId].books.push({ title: row[5], year: row[6], isbn: row[8], price: parseInt(String(row[9] || "0").replace(/[^0-9]/g, '')) || 0, coverUrl: row[10] });
                            importedCount++;
                        });
                        Object.entries(libMap).forEach(([id, data]) => { batch.set(doc(db, 'artifacts', appId, 'public', 'data', 'library', id), data); });
                    }
                    await batch.commit(); alert(`同步成功！共處理 ${importedCount} 筆資料。`); setCsvInput(''); fetchAdminData();
                } catch (err) { alert("同步失敗：" + err.message); }
                finally { setIsLoading(false); }
            };

            const handleSubmit = async (e) => {
                if (e) e.preventDefault();
                if (isLoading || !studentData || (isExpired && step !== 'admin_edit')) return;
                setIsLoading(true);
                try {
                    const finalS = {};
                    (studentData.courses || []).forEach(c => {
                        const lib = library[c];
                        const compulsoryBooks = (lib?.books || []).filter(b => b.title === "School-printed Course Pack").map(b => b.title);
                        const selected = (selections[c] || []).filter(t => t !== "Do not order 不訂購" && t !== "No Specific Textbook Required");
                        const merged = [...new Set([...compulsoryBooks, ...selected])];
                        finalS[c] = merged.length > 0 ? merged : ["Do not order 不訂購"];
                    });
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', String(studentData.studentId).trim().toUpperCase()), {
                        studentId: String(studentData.studentId).trim().toUpperCase(), name: studentData.name, cName: studentData.cName,
                        grade: studentData.grade, className: studentData.className, seatNumber: studentData.seatNumber || "",
                        selections: finalS, updatedAt: serverTimestamp()
                    });
                    if (step === 'admin_edit') { alert("訂單已更新"); fetchAdminData(); } else { setStep('success'); }
                } catch (err) { setError("提交失敗"); }
                finally { setIsLoading(false); }
            };

            const openAdminEdit = async (sid) => {
                setIsLoading(true);
                try {
                    const enrollSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'enrollment', sid));
                    const orderSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', sid));
                    setStudentData(enrollSnap.data()); setSelections(orderSnap.exists() ? orderSnap.data().selections : {}); setStep('admin_edit');
                } catch (e) { alert("載入失敗"); }
                finally { setIsLoading(false); }
            };

            // 安全獲取年級進度防護
            const getGradeStats = () => {
                const enrollList = allEnrollment || [];
                const orderList = allOrders || [];
                const grades = [...new Set(enrollList.map(e => e?.grade))].filter(Boolean).sort();
                return grades.map(g => {
                    const total = enrollList.filter(e => e && e.grade === g).length;
                    const finished = orderList.filter(o => o && o.grade === g).length;
                    return { grade: g, total, finished, percent: total > 0 ? Math.round((finished/total)*100) : 0 };
                });
            };

            // 安全獲取催報名單防護
            const getPendingStudents = () => {
                const enrollList = allEnrollment || [];
                const orderList = allOrders || [];
                const finishedIds = new Set(orderList.map(o => o?.studentId).filter(Boolean));
                return enrollList
                    .filter(e => e && e.studentId && !finishedIds.has(e.studentId))
                    .sort((a, b) => String(a?.className || "").localeCompare(String(b?.className || "")));
            };

            const getSubjectStyles = (subject) => {
                const sub = (subject || "").toUpperCase();
                if (sub.includes("MA")) return { text: 'text-rose-600', class: 'course-card-math', label: 'Math' };
                if (sub.includes("SS") || sub.includes("SOCIAL")) return { text: 'text-sky-600', class: 'course-card-social', label: 'Social Studies' };
                if (sub.includes("SC") || sub.includes("SCIENCE")) return { text: 'text-emerald-600', class: 'course-card-science', label: 'Science' };
                return { text: 'text-slate-600', class: 'course-card-default', label: subject || "Course" };
            };

            return (
                <div className={`min-h-screen flex flex-col items-center py-4 md:py-8 px-3 md:px-4 transition-all duration-700 ${step === 'login' ? 'login-bg mesh-pattern' : 'bg-[#f8fafc]'}`}>
                    <div className={`w-full ${step === 'login' ? 'max-w-md' : 'max-w-5xl'} bg-white rounded-[1.5rem] shadow-[0_15px_60px_rgba(0,0,0,0.15)] overflow-hidden border border-slate-100 animate-in`}>
                        <div className="header-bg px-5 py-8 md:py-10 text-white text-center shadow-inner relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16 blur-2xl"></div>
                            <h1 className="text-base md:text-lg font-black uppercase tracking-tight relative z-10 drop-shadow">SY26-27 TEXTBOOK ORDERING SYSTEM</h1>
                            <p className="text-teal-50 text-base md:text-xl font-bold tracking-[0.2em] mt-3 uppercase relative z-10 drop-shadow-md">115學年課本預訂系統</p>
                        </div>

                        {step === 'login' && (
                            <div className="p-8 md:p-12 space-y-6 text-center text-slate-900 bg-white">
                                <div className="space-y-1">
                                    <h2 className="text-xl font-black text-teal-700 tracking-tight">KCIS Student Portal</h2>
                                    <p className="text-slate-400 font-bold text-[9px] tracking-widest uppercase">Portal Authentication</p>
                                </div>
                                <form onSubmit={(e) => { handleLogin(e).catch(err => { setError(String(err?.message || err || "登入失敗")); setIsLoading(false); }); }} className="space-y-3">
                                    <input type="text" required value={studentId} onChange={(e) => { setStudentId(e.target.value); if(error) setError(''); }}
                                        autoCapitalize="none" autoComplete="off" autoCorrect="off" spellCheck="false"
                                        className="w-full px-4 py-3.5 bg-slate-50 border border-slate-100 rounded-xl outline-none text-center font-normal text-base focus:border-teal-500 uppercase placeholder:font-normal placeholder:text-slate-300 shadow-inner" placeholder="學號 STUDENT ID"/>
                                    <input type="password" required value={verifyCode} onChange={(e) => { setVerifyCode(e.target.value); if(error) setError(''); }}
                                        autoComplete="off" inputMode="numeric"
                                        className="w-full px-4 py-3.5 bg-slate-50 border border-slate-100 rounded-xl outline-none text-center font-normal text-base focus:border-teal-500 placeholder:font-normal placeholder:text-slate-300 shadow-inner" placeholder="生日 4 碼 (MMDD)"/>
                                    {error && <div className="text-rose-500 text-[11px] font-medium bg-rose-50 p-2.5 rounded-lg border border-rose-100">{error}</div>}
                                    <button type="submit" disabled={isLoading} className="w-full py-4 bg-teal-600 text-white font-black rounded-xl shadow-lg hover:bg-teal-700 active:scale-95 transition-all text-base mt-2 uppercase tracking-widest flex items-center justify-center gap-2">
                                        {isLoading ? <svg className="animate-spin" width={20} height={20} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 22 6.477 22 12h-4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg> : "Login"}
                                    </button>
                                </form>
                            </div>
                        )}

                        {(step === 'form' || step === 'admin_edit') && studentData && (
                            <div className="p-4 md:p-8 space-y-6 text-slate-900 animate-in bg-white">
                                <div className="bg-white p-4 rounded-xl border border-slate-50 flex flex-col md:flex-row items-center justify-between shadow-sm ring-4 ring-teal-50/30 gap-4">
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 bg-teal-600 rounded-lg flex items-center justify-center text-white shadow-md rotate-2 shrink-0"><Icon name="user" size={20} /></div>
                                        <div>
                                            <h2 className="text-base md:text-lg font-black tracking-tight">{studentData.name} {studentData.cName}</h2>
                                            <p className="text-teal-600 text-[11px] md:text-xs font-bold uppercase tracking-widest">{studentData.className} | Seat {studentData.seatNumber}</p>
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        {step === 'admin_edit' ? (
                                            <button onClick={() => setStep('admin')} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold uppercase tracking-widest">Back to Admin</button>
                                        ) : (
                                            <button onClick={() => setStep('login')} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold uppercase tracking-widest">Logout</button>
                                        )}
                                    </div>
                                </div>

                                {isExpired && step !== 'admin_edit' && (
                                    <div className="bg-amber-50 border-2 border-amber-100 p-4 rounded-2xl flex items-center gap-3 text-amber-700">
                                        <Icon name="alert-triangle" size={20} />
                                        <p className="text-xs md:text-sm font-bold">預訂已截止 ({ORDER_DEADLINE.toLocaleString()})，目前僅供查詢。</p>
                                    </div>
                                )}

                                <form onSubmit={handleSubmit} className="space-y-6">
                                    {(studentData.courses || []).map(code => {
                                        const lib = library[code] || library[code.toUpperCase()];
                                        if (!lib) return null;
                                        const styles = getSubjectStyles(lib.subject);
                                        const currentSelections = selections[code] || [];
                                        const isNoOrder = currentSelections.includes("Do not order 不訂購");

                                        return (
                                            <div key={code} className={`bg-white rounded-2xl border-2 border-slate-50 shadow-sm overflow-hidden transition-all hover:shadow-md ${styles.class}`}>
                                                <div className="p-4 md:p-6 border-b border-slate-50 flex justify-between items-start gap-4">
                                                    <div>
                                                        <span className={`text-[9px] md:text-[10px] font-black uppercase tracking-[0.2em] ${styles.text}`}>{styles.label}</span>
                                                        <h3 className="text-sm md:text-lg font-black text-slate-800 leading-tight mt-1">{lib.courseName}</h3>
                                                        <p className="text-[10px] md:text-xs text-slate-400 font-medium mt-1 uppercase tracking-wider">{code} • {lib.publisher} • {lib.level}</p>
                                                    </div>
                                                </div>
                                                <div className="p-3 md:p-6 bg-slate-50/30 space-y-3">
                                                    {(lib.books || []).map((book, idx) => {
                                                        const isSelected = currentSelections.includes(book.title);
                                                        const isCompulsory = book.title === "School-printed Course Pack";
                                                        const isInfoOnly = book.title === "No Specific Textbook Required";

                                                        if (isInfoOnly) {
                                                            return (
                                                                <div key={idx} className="p-4 bg-white/60 border-2 border-dashed border-slate-200 rounded-xl text-center">
                                                                    <p className="text-slate-400 font-bold text-[11px] md:text-xs italic">No Specific Textbook Required.</p>
                                                                </div>
                                                            );
                                                        }

                                                        return (
                                                            <div key={idx}
                                                                onClick={() => {
                                                                    if ((isExpired && step !== 'admin_edit') || isCompulsory) return;
                                                                    setSelections(prev => {
                                                                        const prevList = prev[code] || [];
                                                                        const newList = prevList.filter(t => t !== "Do not order 不訂購" && t !== "No Specific Textbook Required");
                                                                        if (newList.includes(book.title)) {
                                                                            return { ...prev, [code]: newList.filter(t => t !== book.title) };
                                                                        } else {
                                                                            return { ...prev, [code]: [...newList, book.title] };
                                                                        }
                                                                    });
                                                                }}
                                                                className={`group relative p-3 md:p-4 rounded-2xl border-2 transition-all cursor-pointer flex gap-4 items-center ${isSelected || isCompulsory ? 'bg-white border-teal-500 shadow-md ring-4 ring-teal-500/5' : 'bg-white border-white hover:border-teal-200 hover:shadow-sm'}`}>
                                                                <div className="shrink-0 w-16 h-[88px] md:w-20 md:h-28 rounded border border-slate-200 overflow-hidden bg-slate-50 shadow-sm">
                                                                    <BookCover isbn={book.isbn} coverUrl={book.coverUrl} title={book.title} />
                                                                </div>
                                                                <div className="flex-1 flex justify-between items-center gap-4">
                                                                    <div className="space-y-1">
                                                                        <div className="flex items-center gap-2">
                                                                            {isCompulsory ? <CheckSquareIcon size={18} color="#0d9488" /> : isSelected ? <CheckSquareIcon size={18} color="#0d9488" /> : <SquareIcon size={18} color="#cbd5e1" />}
                                                                            <span className={`text-xs md:text-sm font-black leading-tight ${isSelected || isCompulsory ? 'text-teal-900' : 'text-slate-600'}`}>{book.title}</span>
                                                                            {isCompulsory && <span className="bg-teal-100 text-teal-700 text-[8px] md:text-[9px] px-2 py-0.5 rounded-md font-black uppercase tracking-widest">Required</span>}
                                                                        </div>
                                                                        {book.isbn && <span className="text-[8px] md:text-[10px] text-slate-400 block font-mono">ISBN: {book.isbn}</span>}
                                                                    </div>
                                                                    <div className="text-right shrink-0">
                                                                        {book.price > 0 ? (<div className="flex flex-col items-end"><div className="text-teal-600 text-[11px] md:text-base font-black font-mono leading-none">${book.price}</div><div className="text-[7px] md:text-[8px] text-slate-300 font-bold uppercase mt-1">Ref.</div></div>) : (<div className="flex flex-col items-end"><div className="text-teal-700 text-[10px] md:text-[12px] font-black uppercase bg-teal-100 px-2.5 py-1 rounded shadow-sm border border-teal-200 whitespace-nowrap">New Version</div><div className="text-[10px] md:text-[12px] text-slate-400 font-bold italic mt-1 whitespace-nowrap">TBA (July)</div></div>)}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                    <div onClick={() => { if (isExpired && step !== 'admin_edit') return; const hasCompulsory = (lib.books || []).some(b => b.title === "School-printed Course Pack"); if (hasCompulsory) return; setSelections(prev => ({ ...prev, [code]: ["Do not order 不訂購"] })) }}
                                                        className={`p-3 border rounded-xl text-center font-bold italic text-[11px] md:text-xs transition-all flex items-center justify-center gap-2 cursor-pointer ${(lib.books || []).some(b => b.title === "School-printed Course Pack") ? 'bg-slate-50 text-slate-200 cursor-not-allowed opacity-50' : isNoOrder ? 'bg-slate-800 text-white shadow-md' : 'bg-white border-slate-100 text-slate-300 hover:border-teal-200'}`}>
                                                        {isNoOrder ? <CheckSquareIcon size={16} color="white" /> : <SquareIcon size={16} color="#cbd5e1" />} 不訂購 Do not order
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    <button type="submit" disabled={isLoading} className="w-full py-4 bg-teal-600 text-white font-black rounded-xl shadow-lg text-sm md:text-lg uppercase tracking-[0.2em] transition-all flex items-center justify-center gap-2">
                                        {isLoading ? <svg className="animate-spin" width={20} height={20} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 22 6.477 22 12h-4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg> : "Confirm Order (確認訂購)"}
                                    </button>
                                </form>
                            </div>
                        )}

                        {step === 'admin' && (
                            <div className="p-4 md:p-10 space-y-8 text-slate-900 bg-white">
                                <div className="flex justify-between items-center border-b pb-6">
                                    <h2 className="text-lg md:text-2xl font-medium uppercase text-teal-700 leading-none tracking-tight">Admin Dashboard</h2>
                                    <button onClick={() => setStep('login')} className="px-5 py-2 bg-slate-50 rounded-lg text-sm font-medium border-2 border-slate-100 hover:text-teal-600">Logout</button>
                                </div>
                                <div className="flex flex-wrap gap-2.5 mb-2">
                                    {['summary', 'all_orders', 'pending', 'import'].map(tab => (
                                        <button key={tab} onClick={() => setAdminTab(tab)} className={`px-6 py-2.5 text-sm font-medium rounded-xl uppercase tracking-wider transition-all shadow-sm ${adminTab === tab ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>{tab.replace('_', ' ')}</button>
                                    ))}
                                </div>

                                {adminTab === 'summary' && (
                                    <div className="space-y-8">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                                            {getGradeStats().map(s => (
                                                <div key={s.grade} className="bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 shadow-sm">
                                                    <div className="flex justify-between items-end mb-2"><span className="text-slate-400 font-medium uppercase text-[11px] tracking-widest">Grade {s.grade}</span><span className="text-teal-600 font-semibold text-2xl">{s.percent}%</span></div>
                                                    <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden mb-2"><div className="bg-teal-600 h-full transition-all duration-1000" style={{ width: `${s.percent}%` }}></div></div>
                                                    <p className="text-slate-500 font-normal text-[11px] uppercase opacity-60">Filled: {s.finished} / {s.total}</p>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="bg-white border-2 border-slate-100 rounded-[1.5rem] overflow-hidden shadow-sm">
                                            <div className="bg-slate-50 p-6 border-b flex flex-wrap justify-between items-center gap-4">
                                                <span className="text-teal-800 text-sm md:text-lg font-medium uppercase tracking-tight">採購總量統計</span>
                                                <div className="flex gap-2 flex-wrap">
                                                    {['orders', 'flat', 'books'].map(t => (
                                                        <button key={t} onClick={() => exportToCSV(t)} className="text-xs md:text-sm font-medium uppercase px-4 py-2 bg-white border-2 border-slate-200 rounded-xl shadow-sm hover:border-teal-500 hover:text-teal-600 transition-all">
                                                            {t === 'orders' ? '📘 總表' : t === 'flat' ? '📄 明細' : '📦 發書'}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                            <table className="w-full text-left text-sm md:text-base"><tbody className="divide-y-2 divide-slate-50">
                                                {Object.entries(bookStats || {}).sort((a, b) => {
                                                    const countA = a[1]?.count || 0;
                                                    const countB = b[1]?.count || 0;
                                                    return countB - countA;
                                                }).map(([title, data]) => (
                                                    <tr key={title} className="hover:bg-teal-50/50 transition-colors">
                                                        <td className="p-5 text-slate-700 leading-snug font-medium">{title}</td>
                                                        <td className="p-5 text-right"><span className="bg-teal-600 text-white px-4 py-1.5 rounded-2xl text-sm md:text-base font-mono shadow-sm font-semibold">{data?.count || 0}</span></td>
                                                    </tr>
                                                ))}
                                            </tbody></table>
                                        </div>
                                    </div>
                                )}

                                {adminTab === 'all_orders' && (
                                    <div className="overflow-x-auto rounded-2xl border-2 border-slate-100 shadow-sm">
                                        <table className="w-full text-left text-sm md:text-base zebra-table">
                                            <thead className="bg-slate-50 border-b-2 text-teal-800"><tr><th className="p-5 font-semibold tracking-wider">學號 SID</th><th className="p-5 font-semibold">班級 Class</th><th className="p-5 font-semibold">姓名 Name</th><th className="p-5 text-center font-semibold">項目</th><th className="p-5 font-semibold text-right">最後更新</th></tr></thead>
                                            <tbody className="divide-y-2 divide-slate-50">
                                                {[...(allOrders || [])].sort((a, b) => String(a?.className || "").localeCompare(String(b?.className || ""))).map(o => {
                                                    if (!o) return null;
                                                    const selectionsMap = o.selections || {};
                                                    const validCount = Object.values(selectionsMap).flat().filter(b => b && !b.includes('不訂購') && !b.includes('No Specific Textbook Required')).length;
                                                    return (
                                                        <tr key={o.studentId} className="hover:bg-teal-100/30 transition-colors odd:bg-white even:bg-teal-50">
                                                            <td className="p-5"><button onClick={()=>openAdminEdit(o.studentId)} className="text-teal-600 font-medium hover:underline">{o.studentId}</button></td>
                                                            <td className="p-5">{o.className || '-'}</td><td className="p-5 font-medium text-slate-800">{o.cName || '-'}</td>
                                                            <td className="p-5 text-center font-mono text-teal-700">{validCount}</td>
                                                            <td className="p-5 text-slate-400 text-xs font-mono text-right">{o.updatedAt?.seconds ? new Date(o.updatedAt.seconds * 1000).toLocaleString() : '-'}</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                )}

                                {adminTab === 'pending' && (
                                    <div className="space-y-5">
                                        <div className="bg-teal-50 p-6 rounded-2xl flex justify-between items-center border-2 border-teal-100 shadow-inner"><h3 className="text-teal-900 font-semibold uppercase text-base md:text-xl tracking-widest">未填寫：{getPendingStudents().length} 人</h3><button onClick={() => exportToCSV('pending')} className="bg-teal-600 text-white px-6 py-2.5 rounded-xl font-medium uppercase shadow-lg text-sm tracking-widest hover:bg-teal-700">匯出 CSV</button></div>
                                        <div className="overflow-x-auto rounded-2xl border-2 border-slate-100">
                                            <table className="w-full text-left text-sm md:text-base zebra-table">
                                                <thead className="bg-slate-50 text-teal-800 border-b-2"><tr><th className="p-5 font-semibold">班級 Class</th><th className="p-5 font-semibold">座號 Seat</th><th className="p-5 font-semibold">學號 SID</th><th className="p-5 font-semibold">姓名 Name</th></tr></thead>
                                                <tbody className="divide-y-2 divide-slate-50">
                                                    {getPendingStudents().map(s => {
                                                        if (!s) return null;
                                                        return (
                                                            <tr key={s.studentId} className="hover:bg-teal-100/30 transition-colors odd:bg-white even:bg-teal-50">
                                                                <td className="p-5 text-teal-700 font-medium">{s.className || '-'}</td><td className="p-5">{s.seatNumber || '-'}</td>
                                                                <td className="p-5 font-mono text-slate-500">{s.studentId}</td><td className="p-5 font-medium">{s.cName || '-'}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {adminTab === 'import' && (
                                    <div className="space-y-6 animate-in">
                                        <div className="flex gap-3">{['orders','enrollment','library'].map(c => (<button key={c} onClick={() => clearData(c)} className="flex-1 py-3.5 bg-rose-50 text-rose-600 rounded-xl font-medium text-sm border-2 border-rose-100 uppercase tracking-widest hover:bg-rose-100 transition-all shadow-sm">Clear {c}</button>))}</div>
                                        <div className="flex gap-4"><button onClick={() => setImportType('enrollment')} className={`flex-1 py-6 rounded-[2rem] font-medium border-4 transition-all text-sm md:text-xl shadow-md ${importType === 'enrollment' ? 'border-teal-500 bg-teal-50 text-teal-700' : 'border-slate-100 text-slate-400'}`}>匯入學生 Enrollment</button><button onClick={() => setImportType('library')} className={`flex-1 py-6 rounded-[2rem] font-medium border-4 transition-all text-sm md:text-xl shadow-md ${importType === 'library' ? 'border-teal-500 bg-teal-50 text-teal-700' : 'border-slate-100 text-slate-400'}`}>匯入書庫 Library</button></div>
                                        <textarea value={csvInput} onChange={(e) => setCsvInput(e.target.value)} className="w-full h-40 p-6 bg-slate-50 border-2 border-slate-200 rounded-3xl text-sm md:text-base font-mono outline-none shadow-inner custom-scrollbar" placeholder="Paste data here..."/>
                                        <button onClick={processImport} disabled={isLoading} className="w-full py-5 bg-slate-800 text-white font-medium rounded-3xl uppercase tracking-[0.5em] shadow-xl text-lg hover:bg-black transition-all flex items-center justify-center gap-2">
                                            {isLoading && <svg className="animate-spin" width={20} height={20} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 22 6.477 22 12h-4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/></svg>} Sync to Cloud
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {step === 'success' && (
                            <div className="p-16 text-center space-y-8 bg-white animate-in">
                                <div className="mx-auto w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-500 shadow-xl"><Icon name="check" size={40} /></div>
                                <h2 className="text-2xl md:text-4xl font-black uppercase text-teal-700 tracking-tight">Order Success!</h2>
                                <div className="space-y-4 text-sm md:text-base leading-relaxed">
                                    <p className="text-slate-500 font-bold">訂單已成功送出，2026/6/3 截止日前可隨時登入修改。</p>
                                    <div className="bg-rose-50 border border-rose-100 p-4 rounded-xl max-w-md mx-auto animate-in">
                                        <p className="text-rose-600 font-bold text-xs md:text-sm">
                                            重要提醒：<br/>
                                            課本一經訂購，恕不接受退書或取消，請務必審慎填寫。
                                        </p>
                                    </div>
                                </div>
                                <button onClick={() => setStep('login')} className="px-12 py-4 bg-teal-600 text-white font-black rounded-xl shadow-lg uppercase text-xs tracking-widest hover:scale-105 transition-all">Return Home</button>
                            </div>
                        )}
                    </div>

                    <div className="mt-10 text-center space-y-4 pb-12 w-full max-w-xl animate-in px-4">
                        <div className="flex flex-col md:flex-row items-center justify-center gap-2 md:gap-4 px-8 py-3 bg-slate-900 text-white rounded-2xl shadow-xl border border-slate-800">
                            <span className="text-[10px] md:text-[11px] font-black tracking-[0.2em] uppercase whitespace-nowrap">KCIS Linkou IPD | Textbook Ordering</span>
                            <span className="hidden md:block w-1.5 h-1.5 bg-teal-500 rounded-full shadow-[0_0_8px_#14b8a6]"></span>
                            <span className="text-[10px] md:text-[11px] font-bold text-orange-400 whitespace-nowrap tracking-widest">© 2026-2027</span>
                        </div>
                        <div className="flex flex-col items-center opacity-70">
                            <div className="text-[9px] md:text-[10px] text-slate-500 font-black uppercase tracking-[0.2em] mb-1">Academic Affairs Department</div>
                            <div className="text-[8px] md:text-[9px] text-teal-900 font-black uppercase tracking-[0.4em]">Designed by Cindy Lin</div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
