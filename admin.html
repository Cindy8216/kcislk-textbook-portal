<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>發書進度總覽 | KCIS IPD SY26-27</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --kcis-blue: #00A3E0; }
        .cls-row { transition: background 0.12s; }
        .cls-row:hover { background: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="sticky top-0 z-40 shadow-md" style="background:#00A3E0">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <span class="text-white font-black text-base tracking-tight">KCIS 發書進度總覽</span>
            <div class="flex items-center gap-3">
                <span id="overall" class="text-white/90 text-sm font-bold"></span>
                <button onclick="load()" class="bg-white/20 text-white text-xs px-2.5 py-1 rounded font-black hover:bg-white/30">重新整理</button>
            </div>
        </div>
    </div>

    <main class="max-w-4xl mx-auto p-4 mt-4">
        <div id="board"></div>
    </main>

    <div id="loading" class="text-center py-24 text-slate-400 text-sm">連線中，請稍候...</div>

    <script>
        const API_BASE = "https://script.google.com/macros/s/AKfycbwmKGOz4eSzEuyt65P6T2_knuNkj3LpCmnfJPXK8r4GM-MdUUfwVys1YMw7T-uY59Y-gQ/exec";

        // 班級排序：先年級（8→9→11→12），同年級字母班在前、數字班在後（跟發書工具一致）
        function parseClass(code) {
            code = String(code).trim().toUpperCase();
            const a = code.match(/^(\d+)([A-Z]+)$/);
            if (a) return { grade: parseInt(a[1], 10), isNumeric: false, alphaKey: a[2], numKey: 0 };
            if (/^\d+$/.test(code)) return { grade: parseInt(code.slice(0, -2) || code, 10), isNumeric: true, alphaKey: "", numKey: parseInt(code.slice(-2), 10) };
            return { grade: 9999, isNumeric: true, alphaKey: code, numKey: 0 };
        }
        function compareClass(a, b) {
            const pa = parseClass(a), pb = parseClass(b);
            if (pa.grade !== pb.grade) return pa.grade - pb.grade;
            if (pa.isNumeric !== pb.isNumeric) return pa.isNumeric ? 1 : -1;
            if (!pa.isNumeric) return pa.alphaKey.localeCompare(pb.alphaKey);
            return pa.numKey - pb.numKey;
        }

        // 科目標籤（明細分組用）
        const SUBJECT_ORDER = { "english": 1, "math": 2, "science": 3, "social studies": 4 };
        const SUBJECT_LABEL = { "english": "英文", "math": "數學", "science": "自然", "social studies": "社會", "notebook": "筆記本" };
        function subjKey(b) { return (b.type === "supply") ? "notebook" : String(b.subject || "").trim().toLowerCase(); }
        function subjRank(b) { return (b.type === "supply") ? 99 : (SUBJECT_ORDER[subjKey(b)] || 90); }
        function subjLabel(b) { return SUBJECT_LABEL[subjKey(b)] || (b.subject || "其他"); }

        function fmtTime(v) {
            if (!v) return "";
            const d = new Date(v);
            if (isNaN(d)) return "";
            const diff = (Date.now() - d.getTime()) / 1000;
            if (diff < 60) return "剛剛";
            if (diff < 3600) return Math.floor(diff / 60) + " 分鐘前";
            if (diff < 86400) return Math.floor(diff / 3600) + " 小時前";
            return d.toLocaleDateString();
        }

        let expanded = {};   // { class: true } 記住展開狀態

        // Apps Script 偶爾回傳 HTML 錯誤頁而非 JSON，收到非 JSON 就自動重試
        async function fetchJson(url, tries) {
            tries = tries || 3;
            let lastErr;
            for (let k = 0; k < tries; k++) {
                try {
                    const text = await (await fetch(url)).text();
                    try { return JSON.parse(text); }
                    catch (e) { lastErr = new Error("後端暫時忙碌，正在重試…"); }
                } catch (e) { lastErr = e; }
                await new Promise(r => setTimeout(r, 600 * (k + 1)));
            }
            throw lastErr || new Error("載入失敗");
        }

        async function load() {
            try {
                const [clsRes, progRes] = await Promise.all([
                    fetchJson(API_BASE + "?action=getClasses"),
                    fetchJson(API_BASE + "?action=getProgress")
                ]);

                const allClasses = Array.isArray(clsRes) ? clsRes.slice() : [];
                const progMap = {};
                (Array.isArray(progRes) ? progRes : []).forEach(p => { progMap[String(p.class).trim().toUpperCase()] = p; });

                // 以「所有班級」為主，沒進度的標成尚未開始
                allClasses.sort(compareClass);
                render(allClasses, progMap);

                document.getElementById("loading").classList.add("hidden");
            } catch (e) {
                document.getElementById("loading").textContent = "載入失敗：" + e.message;
            }
        }

        function render(allClasses, progMap) {
            // 整體統計
            let doneClasses = 0, startedClasses = 0;
            allClasses.forEach(c => {
                const p = progMap[c.toUpperCase()];
                if (p && p.totalBooks > 0) {
                    startedClasses++;
                    if (p.totalDone >= p.totalBooks) doneClasses++;
                }
            });
            document.getElementById("overall").textContent =
                "全發完 " + doneClasses + " 班 · 進行中 " + (startedClasses - doneClasses) + " 班 · 未開始 " + (allClasses.length - startedClasses) + " 班";

            // 依年級分組
            const groups = {}, order = [];
            allClasses.forEach(c => {
                const g = parseClass(c).grade;
                if (!groups[g]) { groups[g] = []; order.push(g); }
                groups[g].push(c);
            });
            const gradeLabel = g => (g >= 1 && g <= 12) ? (g + " 年級") : "其他";

            document.getElementById("board").innerHTML = order.map(g => `
                <section class="mb-5">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="text-xs font-black text-white px-2.5 py-1 rounded-md" style="background:#00A3E0">${gradeLabel(g)}</span>
                        <span class="h-px flex-1 bg-slate-200"></span>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100 overflow-hidden">
                        ${groups[g].map(c => classRow(c, progMap[c.toUpperCase()])).join("")}
                    </div>
                </section>
            `).join("");
        }

        function classRow(cls, p) {
            const has = p && p.totalBooks > 0;
            const done = has ? p.totalDone : 0;
            const total = has ? p.totalBooks : 0;
            const pct = total > 0 ? Math.round(done / total * 100) : 0;
            const allDone = has && done >= total;
            const notStarted = !has;

            const barColor = allDone ? "#22c55e" : "#00A3E0";
            const statusText = notStarted
                ? `<span class="text-slate-400 text-xs font-bold">尚未開始</span>`
                : `<span class="text-xs font-bold ${allDone ? "text-green-600" : "text-slate-500"}">${done}/${total} 種${allDone ? " ✓" : ""}</span>`;

            const isOpen = !!expanded[cls] && has;

            return `<div>
                <div class="cls-row flex items-center gap-3 px-4 py-3 cursor-pointer" onclick="toggle('${cls}')">
                    <span class="font-black text-slate-700 text-sm w-14 shrink-0">${cls}</span>
                    <div class="flex-1 min-w-0">
                        <div class="h-2 rounded-full bg-slate-100 overflow-hidden">
                            <div style="width:${pct}%;background:${barColor}" class="h-full rounded-full transition-all"></div>
                        </div>
                    </div>
                    <div class="w-24 text-right shrink-0">${statusText}</div>
                    <span class="text-slate-300 text-xs w-4 shrink-0">${has ? (isOpen ? "▾" : "▸") : ""}</span>
                </div>
                ${isOpen ? `<div class="px-4 pb-3 pt-1 bg-slate-50/60">
                    <div class="text-[11px] text-slate-400 mb-2">最後更新：${fmtTime(p.updatedAt)}</div>
                    ${bookDetail(p.books)}
                </div>` : ""}
            </div>`;
        }

        function bookDetail(books) {
            const list = (books || []).slice().sort((a, b) => {
                const ra = subjRank(a), rb = subjRank(b);
                if (ra !== rb) return ra - rb;
                return String(a.title).localeCompare(String(b.title));
            });

            // 依科目分組
            const groups = [];
            list.forEach(b => {
                const key = subjKey(b);
                let g = groups.length ? groups[groups.length - 1] : null;
                if (!g || g.key !== key) { g = { key, label: subjLabel(b), items: [] }; groups.push(g); }
                g.items.push(b);
            });

            return groups.map(g => `
                <div class="mb-2">
                    <div class="text-[11px] font-black text-slate-500 mb-1">${g.label}</div>
                    <div class="space-y-1">
                        ${g.items.map(b => {
                            const d = b.done || 0, t = b.total || 0;
                            const ok = t > 0 && d >= t;
                            return `<div class="flex items-center gap-2 text-xs">
                                <span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${ok ? "#22c55e" : (d > 0 ? "#f59e0b" : "#cbd5e1")}"></span>
                                <span class="flex-1 min-w-0 truncate ${ok ? "text-slate-400" : "text-slate-700"}">${b.title}</span>
                                <span class="shrink-0 font-bold ${ok ? "text-green-600" : "text-slate-500"}">${d}/${t}</span>
                            </div>`;
                        }).join("")}
                    </div>
                </div>
            `).join("");
        }

        function toggle(cls) {
            expanded[cls] = !expanded[cls];
            load();   // 重讀並重繪（順便刷新數字）
        }

        load();
        setInterval(load, 45000);   // 每 45 秒自動刷新
    </script>
</body>
</html>
