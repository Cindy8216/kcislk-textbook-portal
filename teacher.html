<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>發書工具 | KCIS IPD SY26-27</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --kcis-blue: #00A3E0; }
        .book-card { transition: all 0.2s; cursor: pointer; }
        .book-card:active { transform: scale(0.97); }
        .book-card.all-done { opacity: 0.45; }
        .stu-row { transition: background 0.15s; }
        .stu-row.done { background: #f0fdf4; }
        .stu-row.done .stu-name { text-decoration: line-through; color: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="sticky top-0 z-40 shadow-md" style="background:#00A3E0">
        <div class="max-w-4xl mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="text-white font-black text-base tracking-tight">KCIS 發書工具</span>
                    <span id="classBadge" class="bg-white/20 text-white text-xs px-2 py-0.5 rounded font-black"></span>
                </div>
                <div id="overallProgress" class="text-white/90 text-sm font-bold"></div>
            </div>
        </div>
    </div>

    <!-- 班級選擇（沒帶 ?class= 時顯示） -->
    <main id="classPicker" class="hidden max-w-4xl mx-auto p-4 mt-6">
        <h1 class="text-slate-800 font-black text-lg mb-1">請選擇你的班級</h1>
        <p class="text-slate-400 text-xs mb-4">選好之後可以把網址存成書籤，下次直接進入</p>
        <div id="classGrid" class="grid grid-cols-3 sm:grid-cols-5 gap-2"></div>
    </main>

    <!-- 書封列表 -->
    <main id="bookView" class="hidden max-w-4xl mx-auto p-4 mt-4">
        <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        <div class="text-center mt-8">
            <button onclick="resetClass()" class="text-slate-400 text-xs underline">重設本班發書紀錄</button>
        </div>
    </main>

    <div id="loading" class="text-center py-24 text-slate-400 text-sm">連線中，請稍候...</div>

    <!-- 學生名單 -->
    <div id="modalBg" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
        <div class="bg-white w-full max-w-md rounded-t-2xl md:rounded-2xl overflow-hidden flex flex-col" style="max-height:90vh" onclick="event.stopPropagation()">
            <div class="px-5 py-4 flex items-start justify-between shrink-0" style="background:#00A3E0">
                <div class="pr-4">
                    <h2 id="modalTitle" class="text-white font-black text-base leading-tight"></h2>
                    <p id="modalSub" class="text-white/60 text-xs mt-1"></p>
                </div>
                <button onclick="closeModal()" class="text-white/70 hover:text-white text-2xl leading-none mt-0.5">&#x2715;</button>
            </div>

            <div class="px-5 py-2 bg-slate-100 border-b border-slate-200 flex justify-between shrink-0">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">學生</span>
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">已領</span>
            </div>

            <div id="modalBody" class="overflow-y-auto divide-y divide-slate-100 flex-1"></div>

            <div class="px-5 py-3 bg-slate-50 border-t border-slate-200 shrink-0">
                <div id="modalSummary" class="text-sm font-bold text-slate-600 text-center mb-2"></div>
                <button id="markAllBtn" onclick="toggleAll()"
                    class="w-full py-3 rounded-xl font-black text-base flex items-center justify-center gap-2 active:scale-[0.98] transition"></button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://script.google.com/macros/s/AKfycbwmKGOz4eSzEuyt65P6T2_knuNkj3LpCmnfJPXK8r4GM-MdUUfwVys1YMw7T-uY59Y-gQ/exec";

        let currentClass = null;
        let books = [];
        let currentBook = null;
        let handed = {};   // { isbn: { studentKey: true } }

        // ── 班級排序 ─────────────────────────────────────────────
        // 先按年級（8→9→11→12），同年級內字母班（8A~8F）在前、數字班（801~804）在後
        function parseClass(code) {
            code = String(code).trim().toUpperCase();
            // 字母班：數字開頭 + 字母，例如 8A、11C
            const alpha = code.match(/^(\d+)([A-Z]+)$/);
            if (alpha) {
                return { grade: parseInt(alpha[1], 10), isNumeric: false, alphaKey: alpha[2], numKey: 0 };
            }
            // 數字班：純數字，後兩位當班號、其餘當年級，例如 801→8年級01班、1102→11年級02班
            if (/^\d+$/.test(code)) {
                const grade = parseInt(code.slice(0, -2) || code, 10);
                const numKey = parseInt(code.slice(-2), 10);
                return { grade, isNumeric: true, alphaKey: "", numKey };
            }
            // 無法辨識的代碼 → 放到最後
            return { grade: 9999, isNumeric: true, alphaKey: code, numKey: 0 };
        }
        function compareClass(a, b) {
            const pa = parseClass(a), pb = parseClass(b);
            if (pa.grade !== pb.grade) return pa.grade - pb.grade;      // 先比年級
            if (pa.isNumeric !== pb.isNumeric) return pa.isNumeric ? 1 : -1; // 字母班在前
            if (!pa.isNumeric) return pa.alphaKey.localeCompare(pb.alphaKey); // A→B→C
            return pa.numKey - pb.numKey;                               // 01→02→03
        }
        // ─────────────────────────────────────────────────────────

        const storageKey = () => "kcis_handout_sy2627_" + currentClass;
        const stuKey = (s) => s.id || s.seat;

        function loadHanded() {
            handed = JSON.parse(localStorage.getItem(storageKey()) || "{}");
        }
        function saveHanded() {
            localStorage.setItem(storageKey(), JSON.stringify(handed));
        }
        function isHanded(isbn, s) {
            return !!(handed[isbn] && handed[isbn][stuKey(s)]);
        }
        function setHanded(isbn, s, val) {
            if (!handed[isbn]) handed[isbn] = {};
            if (val) handed[isbn][stuKey(s)] = true;
            else delete handed[isbn][stuKey(s)];
            saveHanded();
        }
        function doneCountFor(book) {
            return book.students.filter(s => isHanded(book.isbn, s)).length;
        }
        function isBookDone(book) {
            return book.students.length > 0 && doneCountFor(book) === book.students.length;
        }

        function coverFor(book) {
            const isbn = String(book.isbn).replace(/-/g, "");
            return book.coverUrl || ("https://covers.openlibrary.org/b/isbn/" + isbn + "-M.jpg");
        }
        const FALLBACK_COVER = "https://via.placeholder.com/200x280/F1F5F9/94A3B8?text=No+Cover";

        function showLoading(msg) {
            const el = document.getElementById("loading");
            el.textContent = msg;
            el.classList.remove("hidden");
        }

        async function init() {
            const params = new URLSearchParams(location.search);
            currentClass = (params.get("class") || "").trim().toUpperCase();

            if (!currentClass) return showClassPicker();
            await loadClass();
        }

        async function showClassPicker() {
            showLoading("載入班級中...");
            try {
                const res = await fetch(API_BASE + "?action=getClasses");
                const classes = await res.json();
                if (!Array.isArray(classes)) throw new Error("後端尚未提供 getClasses");

                classes.sort(compareClass);   // ← 顯示前先排序

                document.getElementById("classGrid").innerHTML = classes.map(c =>
                    `<a href="?class=${encodeURIComponent(c)}"
                        class="bg-white border-2 border-slate-200 rounded-xl py-4 text-center font-black text-slate-700 hover:border-sky-400 hover:text-sky-500">${c}</a>`
                ).join("");

                document.getElementById("loading").classList.add("hidden");
                document.getElementById("classPicker").classList.remove("hidden");
            } catch (e) {
                showLoading("載入失敗：" + e.message);
            }
        }

        async function loadClass() {
            showLoading("載入 " + currentClass + " 的書單...");
            loadHanded();
            try {
                const res = await fetch(API_BASE + "?action=getClassBooks&class=" + encodeURIComponent(currentClass));
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                if (!Array.isArray(data.books)) throw new Error("後端尚未提供 getClassBooks");
                if (data.books.length === 0) throw new Error("查無 " + currentClass + " 的書單，請確認班級代碼");

                books = data.books;
                document.getElementById("classBadge").textContent = currentClass;
                renderGrid();
                document.getElementById("loading").classList.add("hidden");
                document.getElementById("bookView").classList.remove("hidden");
            } catch (e) {
                showLoading("載入失敗：" + e.message);
            }
        }

        function renderGrid() {
            const done = books.filter(isBookDone).length;
            document.getElementById("overallProgress").textContent = "發完 " + done + " / " + books.length + " 種";

            document.getElementById("bookGrid").innerHTML = books.map((book, i) => {
                const d = doneCountFor(book);
                const n = book.students.length;
                const allDone = isBookDone(book);

                const isSupply = book.type === "supply";

                // 文具沒有書封，改用圖示＋藍底，讓導師一眼分辨這不是課本
                const thumb = isSupply
                    ? `<div class="h-full w-full flex flex-col items-center justify-center gap-2" style="background:#e0f2fe">
                           <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                               <path d="M4 4a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 2v20"/><path d="M12 7h4M12 11h4"/>
                           </svg>
                           <span class="text-[10px] font-black" style="color:#0284c7">筆記本</span>
                       </div>`
                    : `<img src="${coverFor(book)}" onerror="this.src='${FALLBACK_COVER}'" class="h-full w-full object-cover">`;

                return `<div class="book-card bg-white rounded-2xl overflow-hidden border ${isSupply ? "border-sky-300" : "border-slate-200"} ${allDone ? "all-done" : ""}" onclick="openModal(${i})">
                    <div class="relative bg-slate-100 overflow-hidden" style="height:160px">
                        ${thumb}
                        ${allDone ? `<div class="absolute inset-0 flex items-center justify-center" style="background:rgba(34,197,94,0.35)">
                            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>` : ""}
                    </div>
                    <div class="p-3">
                        <p class="text-[11px] font-black text-slate-800 leading-tight mb-2 line-clamp-2">${book.title}</p>
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] text-slate-400">${n} 人${isSupply && book.qty > 1 ? "　每人 " + book.qty : ""}</span>
                            <span class="text-[11px] font-bold ${allDone ? "text-green-600" : "text-slate-500"}">${d}/${n}</span>
                        </div>
                    </div>
                </div>`;
            }).join("");
        }

        function openModal(i) {
            currentBook = books[i];
            if (!currentBook) return;
            document.getElementById("modalTitle").textContent = currentBook.title;
            const qtyNote = (currentBook.type === "supply" && currentBook.qty > 1) ? "　每人 " + currentBook.qty + " 本" : "";
            document.getElementById("modalSub").textContent = currentClass + "　共 " + currentBook.students.length + " 人" + qtyNote;
            renderModalBody();
            document.getElementById("modalBg").classList.remove("hidden");
        }

        function renderModalBody() {
            const isbn = currentBook.isbn;

            document.getElementById("modalBody").innerHTML = currentBook.students.map((s, i) => {
                const on = isHanded(isbn, s);
                return `<label class="stu-row flex items-center px-5 py-3 gap-3 cursor-pointer ${on ? "done" : ""}">
                    <span class="font-black text-slate-400 text-sm w-8 shrink-0">${s.seat}</span>
                    <span class="stu-name flex-1 min-w-0">
                        <span class="block font-bold text-slate-800 text-sm truncate">${s.name || "—"}</span>
                        <span class="block text-slate-400 text-[11px] truncate">${s.en || ""}</span>
                    </span>
                    <input type="checkbox" ${on ? "checked" : ""} onchange="toggleStudent(${i}, this.checked)"
                        class="w-6 h-6 shrink-0 accent-green-500 cursor-pointer">
                </label>`;
            }).join("");

            const d = doneCountFor(currentBook);
            const n = currentBook.students.length;
            document.getElementById("modalSummary").textContent = "已發 " + d + " / " + n + " 人";

            // 還沒發完 → 綠色大按鈕；已發完 → 收斂成灰色，避免誤按取消
            const btn = document.getElementById("markAllBtn");
            const allDone = (d === n && n > 0);
            const base = "w-full py-3 rounded-xl font-black text-base flex items-center justify-center gap-2 active:scale-[0.98] transition";
            const check = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

            btn.className = base + (allDone ? " bg-slate-200 text-slate-500" : " text-white shadow-lg shadow-green-500/30");
            btn.style.background = allDone ? "" : "#22c55e";
            btn.innerHTML = allDone ? "全部取消" : check + "全部發完";
        }

        function toggleStudent(i, checked) {
            setHanded(currentBook.isbn, currentBook.students[i], checked);
            renderModalBody();
            renderGrid();
        }

        function toggleAll() {
            const allDone = isBookDone(currentBook);
            currentBook.students.forEach(s => setHanded(currentBook.isbn, s, !allDone));
            renderModalBody();
            renderGrid();
        }

        function resetClass() {
            if (!confirm("確定清除 " + currentClass + " 的所有發書紀錄？")) return;
            handed = {};
            saveHanded();
            renderGrid();
        }

        function closeModal() {
            document.getElementById("modalBg").classList.add("hidden");
            currentBook = null;
        }

        document.getElementById("modalBg").addEventListener("click", function (e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") closeModal();
        });

        init();
    </script>
</body>
</html>
